# Flag to confirm external configuration is loading
app.config.loaded=yes

# Application name used by Spring Boot
spring.application.name=mbh_api

# Backend server port
server.port=8080

# Enables MongoDB query logging (useful for debugging)
logging.level.org.springframework.mongodb.core.MongoTemplate=DEBUG

#! use when running locally, but not on live deployment
spring.config.import=optional:file:backend/.env[.properties]  

#! works on live deployment, but not locally
spring.config.import=optional:file:.env[.properties]  

# MongoDB connection values injected from environment variables
spring.mongodb.uri=${SPRING_MONGODB_URI}
spring.mongodb.database=${SPRING_MONGODB_DATABASE}