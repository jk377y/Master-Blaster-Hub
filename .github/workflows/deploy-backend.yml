name: Deploy Backend

# Triggers deployment when working_branch is updated
on:
  push:
    branches:
      - working_branch
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Pull repository code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Configure AWS credentials using repository secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.BACKEND_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BACKEND_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Authenticate Docker to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Build backend Docker image and tag for ECR
      - name: Build Docker image
        run: |
          docker build -t masterblasterhub-backend ./backend
          docker tag masterblasterhub-backend:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/masterblasterhub-backend:latest

      # Push image to Amazon ECR repository
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/masterblasterhub-backend:latest

      # Trigger ECS service to pull new image and redeploy
      - name: Force ECS service redeploy
        run: |
          aws ecs update-service \
            --cluster mbh-backend-cluster \
            --service mbh-backend-service \
            --force-new-deployment